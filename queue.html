<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Очередь заказов — Starkisss Shop ⭐</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Звёзды создаются через JavaScript -->

    <header class="header">

        <a href="index.html" class="logo">
            Starkisss <span>✦</span>
        </a>

        <nav class="nav">

            <a href="#about">
                О магазине
            </a>

            <a href="#services">
                Услуги на заказ
            </a>

            <a href="handmade.html">
                В наличии
            </a>

            <a href="queue.html">
                Очередь заказов
            </a>

            <a href="other.html">
                Прочее
            </a>

            <a href="merch.html">
                Мерч
            </a>

            <a href="mascot.html">
                Маскот
            </a>

        </nav>

        <button class="theme-button">
            ☀
        </button>

        <button
    class="search-button"
    id="searchButton"
    type="button"
    aria-label="Поиск"
>
    🔍
</button>

    </header>

<!-- ================= SEARCH ================= -->

<div
    class="search-overlay"
    id="searchOverlay"
>

    <div class="search-box">

        <div class="search-header">

            <h2>
                🔍 Поиск
            </h2>

            <button
                class="search-close"
                id="searchClose"
                type="button"
            >
                ✕
            </button>

        </div>


        <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Найти товар..."
            autocomplete="off"
        >


        <div
            class="search-results"
            id="searchResults"
        >

            <p class="search-hint">
                Начни вводить название товара ✦
            </p>

        </div>

    </div>

</div>


    <main>

        <!-- ================= ОЧЕРЕДЬ ЗАКАЗОВ ================= -->

        <section class="order-queue" id="queue">

            <div class="queue-title">

                <h2>
                    ✦ Очередь заказов ✦
                </h2>

                <div class="queue-loading">

                    <span>✦</span>

                    <span>
                        Сейчас в работе...
                    </span>

                </div>

            </div>


            <div class="queue-list">


                <!-- ============================= -->
                <!-- В ОЧЕРЕДИ -->
                <!-- ============================= -->

                <div class="queue-column">

                    <div class="queue-column-title">

                        <span class="queue-column-icon">
                            ✧
                        </span>

                        <h3>
                            В очереди
                        </h3>

                        <span class="queue-column-count">
                            0
                        </span>

                    </div>

                    <div
                        class="queue-column-list"
                        data-status="В очереди"
                    ></div>

                </div>


                <!-- ============================= -->
                <!-- ИЗГОТАВЛИВАЕМ -->
                <!-- ============================= -->

                <div class="queue-column">

                    <div class="queue-column-title">

                        <span class="queue-column-icon">
                            ✦
                        </span>

                        <h3>
                            Изготавливаем
                        </h3>

                        <span class="queue-column-count">
                            0
                        </span>

                    </div>

                    <div
                        class="queue-column-list"
                        data-status="Изготавливаем"
                    ></div>

                </div>


                <!-- ============================= -->
                <!-- ГОТОВ К ОТПРАВКЕ -->
                <!-- ============================= -->

                <div class="queue-column">

                    <div class="queue-column-title">

                        <span class="queue-column-icon">
                            ★
                        </span>

                        <h3>
                            Готов к отправке
                        </h3>

                        <span class="queue-column-count">
                            0
                        </span>

                    </div>

                    <div
                        class="queue-column-list"
                        data-status="Готов к отправке"
                    ></div>

                </div>


                <!-- ============================= -->
                <!-- ДОСТАВЛЯЕТСЯ -->
                <!-- ============================= -->

                <div class="queue-column">

                    <div class="queue-column-title">

                        <span class="queue-column-icon">
                            ➜
                        </span>

                        <h3>
                            Доставляется
                        </h3>

                        <span class="queue-column-count">
                            0
                        </span>

                    </div>

                    <div
                        class="queue-column-list"
                        data-status="Доставляется"
                    ></div>

                </div>


            </div>


            <!-- ============================= -->
            <!-- FOOTER -->
            <!-- ============================= -->

            <div class="queue-footer">

                <p>
                    Появились вопросы?
                </p>

                <button
                    class="order-button"
                    onclick="window.open('https://t.me/StarkisssSupport_bot', '_blank')"
                >
                    Напишите в поддержку!
                </button>

            </div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ОСНОВНОЙ СКРИПТ САЙТА -->

    <script src="script.js"></script>

    <!-- ОЧЕРЕДЬ ИЗ SUPABASE -->
    <script src="search.js"></script>
    <script src="queue.js"></script>
    

</body>

</html>
